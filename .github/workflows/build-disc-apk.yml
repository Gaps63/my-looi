name: Build DISC demo APK

# Builds the Android APK of the DISC trade-show fork and publishes it as a
# GitHub Release so it can be downloaded directly from the phone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-disc-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MY_LOOI_RELEASE_KEY_ALIAS: disc-demo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Typecheck and tests
        run: |
          corepack pnpm exec tsc --noEmit
          MY_LOOI_BUILD_ALLOW_LOCAL_ENV=1 corepack pnpm test

      # Signing key: kept between builds in the Actions cache so the phone can
      # install updates over the previous version. Never committed.
      - name: Restore signing key
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: ~/disc-signing
          key: disc-release-keystore-v1

      - name: Create signing key (first build only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/disc-signing
          PASS="$(openssl rand -hex 24)"
          echo "$PASS" > ~/disc-signing/password.txt
          keytool -genkeypair -v -keystore ~/disc-signing/release.keystore \
            -alias "$MY_LOOI_RELEASE_KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=DISC demo LOOI, O=DISC demo"

      - name: Export signing environment
        run: |
          PASS="$(cat ~/disc-signing/password.txt)"
          echo "::add-mask::$PASS"
          echo "MY_LOOI_RELEASE_KEYSTORE=$HOME/disc-signing/release.keystore" >> "$GITHUB_ENV"
          echo "MY_LOOI_RELEASE_STORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "MY_LOOI_RELEASE_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Offline voice-command models
        run: bash scripts/download-vosk-command-models.sh

      - name: Expo prebuild
        run: corepack pnpm exec expo prebuild --platform android --clean

      - name: Gradle release build
        run: |
          node scripts/apply-android-release-signing.mjs android/app/build.gradle
          cd android
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/looi-disc-demo.apk
          ls -la output

      - uses: actions/upload-artifact@v4
        with:
          name: looi-disc-demo-apk
          path: output/looi-disc-demo.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: disc-build-${{ github.run_number }}
          name: LOOI démo DISC — build ${{ github.run_number }}
          make_latest: true
          body: |
            APK de la démo DISC (salon). Sur le téléphone Android : téléchargez `looi-disc-demo.apk` ci-dessous et ouvrez-le.
            Première installation : désinstallez d'abord l'application « My LOOI » d'origine.
          files: output/looi-disc-demo.apk
